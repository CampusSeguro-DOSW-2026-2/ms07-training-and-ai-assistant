services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5437}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8087}:8087"
    environment:
      SERVER_PORT: 8087
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FLYWAY_OUT_OF_ORDER: ${FLYWAY_OUT_OF_ORDER:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_URL: ${LLM_URL:-https://api.openai.com/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-2500ms}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-250}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      GATEWAY_URL: ${GATEWAY_URL:-}
      GATEWAY_SERVICE_KEY: ${GATEWAY_SERVICE_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
