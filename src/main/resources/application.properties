spring.application.name=ms07-training-and-ai-assistant
server.port=${SERVER_PORT:8087}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
logging.pattern.level=%5p [%X{correlationId:-}]
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
# Tutor (RF-15)
campusseguro.tutor.api-key=${LLM_API_KEY:}
campusseguro.tutor.model=${LLM_MODEL:}
campusseguro.tutor.timeout=${LLM_TIMEOUT:2500ms}
management.endpoint.health.probes.enabled=false
