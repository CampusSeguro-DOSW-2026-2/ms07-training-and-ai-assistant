spring.application.name=ms07-training-and-ai-assistant
server.port=${SERVER_PORT:8087}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
logging.pattern.level=%5p [%X{correlationId:-}]
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
# Tutor (RF-15). LLM_PROVIDER is openai or azure; the key only comes from the environment.
campusseguro.tutor.provider=${LLM_PROVIDER:openai}
campusseguro.tutor.url=${LLM_URL:https://api.openai.com/v1/chat/completions}
campusseguro.tutor.api-key=${LLM_API_KEY:}
campusseguro.tutor.model=${LLM_MODEL:gpt-4o-mini}
campusseguro.tutor.timeout=${LLM_TIMEOUT:8000ms}
campusseguro.tutor.max-tokens=${LLM_MAX_TOKENS:250}
campusseguro.tutor.temperature=${LLM_TEMPERATURE:0.2}
# AI evaluation drafts (RF-14): longer timeout and answer than the tutor
campusseguro.evaluation-drafts.timeout=${LLM_GENERATION_TIMEOUT:30s}
campusseguro.evaluation-drafts.max-tokens=${LLM_GENERATION_MAX_TOKENS:1800}
# Tutor search by meaning (embeddings). Without URL or key the search uses only words
campusseguro.tutor.embedding.url=${LLM_EMBEDDING_URL:https://api.openai.com/v1/embeddings}
campusseguro.tutor.embedding.model=${LLM_EMBEDDING_MODEL:text-embedding-3-small}
campusseguro.tutor.embedding.timeout=${LLM_EMBEDDING_TIMEOUT:2000ms}
campusseguro.tutor.search.min-score=${TUTOR_SEARCH_MIN_SCORE:0.35}
# Tutor moderation (OpenAI moderations, free) and protection of the calls to the model
campusseguro.tutor.moderation.enabled=${TUTOR_MODERATION_ENABLED:true}
campusseguro.tutor.moderation.url=${LLM_MODERATION_URL:https://api.openai.com/v1/moderations}
campusseguro.tutor.moderation.model=${LLM_MODERATION_MODEL:omni-moderation-latest}
campusseguro.tutor.moderation.timeout=${LLM_MODERATION_TIMEOUT:2000ms}
campusseguro.tutor.resilience.max-concurrent=${TUTOR_AI_MAX_CONCURRENT:8}
campusseguro.tutor.resilience.circuit-failures=${TUTOR_AI_CIRCUIT_FAILURES:5}
campusseguro.tutor.resilience.circuit-open=${TUTOR_AI_CIRCUIT_OPEN:30s}
# Tutor safety: questions per user and longest answer shown
campusseguro.tutor.safety.rate-per-minute=${TUTOR_RATE_PER_MINUTE:10}
campusseguro.tutor.safety.rate-per-day=${TUTOR_RATE_PER_DAY:100}
campusseguro.tutor.safety.max-answer-chars=${TUTOR_MAX_ANSWER_CHARS:1200}
management.endpoint.health.probes.enabled=false

# Audit Gateway integration
campusseguro.audit.gateway-url=${GATEWAY_URL:}
campusseguro.audit.service-key=${GATEWAY_SERVICE_KEY:}
